<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/AssetsV2/com_apple_MobileAsset_Font8</dir>
  <dir>/Library/Fonts</dir>
  <dir>~/Library/Fonts</dir>
  <cachedir>~/.cache/kodocs-fontconfig</cachedir>
  <!-- HWP 문서가 지정하지만 설치할 수 없는 글꼴을 함초롬으로 대체: 명조 계열 → HCR Batang -->
  <alias binding="same"><family>휴먼명조</family><prefer><family>HCR Batang</family></prefer></alias>
  <alias binding="same"><family>한양신명조</family><prefer><family>HCR Batang</family></prefer></alias>
  <alias binding="same"><family>바탕</family><prefer><family>HCR Batang</family></prefer></alias>
  <alias binding="same"><family>바탕체</family><prefer><family>HCR Batang</family></prefer></alias>
  <alias binding="same"><family>한컴바탕</family><prefer><family>HCR Batang</family></prefer></alias>
  <alias binding="same"><family>명조</family><prefer><family>HCR Batang</family></prefer></alias>
  <alias binding="same"><family>신명조</family><prefer><family>HCR Batang</family></prefer></alias>
  <alias binding="same"><family>HY신명조</family><prefer><family>HCR Batang</family></prefer></alias>
  <alias binding="same"><family>-윤명조120</family><prefer><family>HCR Batang</family></prefer></alias>
  <alias binding="same"><family>함초롬바탕</family><prefer><family>HCR Batang</family></prefer></alias>
  <!-- 고딕 계열 → HCR Dotum -->
  <alias binding="same"><family>맑은 고딕</family><prefer><family>HCR Dotum</family></prefer></alias>
  <alias binding="same"><family>돋움</family><prefer><family>HCR Dotum</family></prefer></alias>
  <alias binding="same"><family>돋움체</family><prefer><family>HCR Dotum</family></prefer></alias>
  <alias binding="same"><family>굴림</family><prefer><family>HCR Dotum</family></prefer></alias>
  <alias binding="same"><family>굴림체</family><prefer><family>HCR Dotum</family></prefer></alias>
  <alias binding="same"><family>HY견고딕</family><prefer><family>HCR Dotum</family></prefer></alias>
  <alias binding="same"><family>HY헤드라인M</family><prefer><family>HCR Dotum</family></prefer></alias>
  <alias binding="same"><family>신명 태고딕</family><prefer><family>HCR Dotum</family></prefer></alias>
  <alias binding="same"><family>#태고딕</family><prefer><family>HCR Dotum</family></prefer></alias>
  <alias binding="same"><family>함초롬돋움</family><prefer><family>HCR Dotum</family></prefer></alias>
</fontconfig>
