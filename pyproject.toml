[project]
name = "kodocs"
version = "0.1.0"
description = "한국어 사내 문서 Agentic RAG와 평가 하네스"
authors = [
    { name = "SpanLee-Time", email = "iih907@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8.0,<2",
    "google-genai>=2.26.0",
    "httpx>=0.28.1",
    "langchain>=1.4.3",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "mcp>=2.2.0",
    "olefile>=0.47",
    "openai>=3.22.1",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
extend-exclude = ["phases", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]
addopts = '-m "not integration"'
markers = [
    "integration: 실행 중인 OpenSearch가 필요한 테스트",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
docling = [
    "docling>=2.130.0",
]
embed = [
    "sentence-transformers>=6.1.0",
]
ui = [
    "streamlit>=1.64.0",
]
