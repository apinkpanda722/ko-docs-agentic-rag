[project]
name = "kodocs"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "SpanLee-Time", email = "iih907@mediazen.co.kr" }
]
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
extend-exclude = ["phases", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests", "scripts"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.16.9",
]
